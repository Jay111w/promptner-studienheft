<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400"><rect width="720" height="400" fill="#ffffff"/><rect x="14" y="14" width="470" height="62" rx="5" fill="none" stroke="#0e7c7b" stroke-width="1.6"/><text x="26" y="32" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start" font-weight="600">Defn:</text><text x="26" y="48" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">An entity is a person (person), an organisation (organisation) such as a</text><text x="26" y="64" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">company, institution, … Dates, numbers, job titles are not entities.</text><rect x="14" y="86" width="470" height="62" rx="5" fill="none" stroke="#1b2430" stroke-width="1.0"/><text x="26" y="104" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start" font-weight="600">Q:</text><text x="26" y="122" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">Given the paragraph below, identify a list of possible entities and for each</text><text x="26" y="138" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">entry explain why it either is or is not an entity:</text><rect x="14" y="158" width="470" height="152" rx="5" fill="none" stroke="#0e7c7b" stroke-width="1.6"/><text x="26" y="176" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start" font-weight="600">Beispiel 1 von k</text><text x="26" y="196" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">Paragraph: EU rejects German call to boycott British lamb .</text><text x="26" y="214" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">Answer:</text><text x="26" y="232" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">1. EU | True | as the European Union is a political</text><text x="26" y="248" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">   organisation (organisation)</text><text x="26" y="266" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">2. German | True | as it is a nationality (miscellaneous)</text><text x="26" y="282" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">3. lamb | False | as it is a common noun, not a named entity</text><text x="26" y="300" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" fill="#6f7b87" text-anchor="start" font-weight="normal">… Beispiele 2 bis k …</text><rect x="14" y="320" width="470" height="62" rx="5" fill="none" stroke="#1b2430" stroke-width="1.0"/><text x="26" y="338" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start" font-weight="600">Zielabsatz</text><text x="26" y="356" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">Paragraph: At the Oval , Surrey captain Chris Lewis … </text><text x="26" y="374" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">Answer:</text><line x1="484" y1="45" x2="512" y2="45" stroke="#1b2430" stroke-width="1"/><text x="518" y="49" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1b2430" text-anchor="start" font-weight="600">E4 ohne Definition</text><line x1="484" y1="234" x2="512" y2="234" stroke="#1b2430" stroke-width="1"/><text x="518" y="238" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1b2430" text-anchor="start" font-weight="600">E6 k = 0 / 2 / 5 / 10</text><line x1="484" y1="351" x2="512" y2="351" stroke="#1b2430" stroke-width="1"/><text x="518" y="355" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1b2430" text-anchor="start" font-weight="600">E10 1–5 Sätze</text><text x="518" y="256" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1b2430" text-anchor="start" font-weight="600">E5 ohne Begründung</text><text x="518" y="276" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1b2430" text-anchor="start" font-weight="600">E7 ohne False-Zeilen</text><text x="518" y="118" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6f7b87" text-anchor="start" font-weight="normal">bleibt immer</text></svg>